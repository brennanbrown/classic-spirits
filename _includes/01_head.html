<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="Jekyll" name="generator">
    <link href="LICENSE" rel="license">

    <meta content="{{ site.title }}" property="og:site_name"/>
    <meta content="{{ site.description }}" property="og:description">
    <meta content="{{ site.url }}/about/" property="article:author">
    <meta name="Description" content="{{ site.description }}">

    {%- if page.title -%}
        <meta content="{{ page.title }}" property="og:title">
        <meta content="article" property="og:type">
        <meta content="{{ site.url }}{{ page.url }}" property="og:url">
    {%- else -%}
        <meta content="website" property="og:type">
        <meta content="{{ site.url }}{{ page.url }}" property="og:url">
    {%- endif -%}

    <meta name="application-name" content="{{ site.title }}">
    <meta name="theme-color" content="{{ site.theme_color }}">
    <link rel="archives" href="{{ '/archive.html' | relative_url }}">

    <!-- All Search Engines -->
    <meta content="index,follow" name="robots">
    <!-- Google Specific -->
    <meta content="index,follow" name="googlebot">


    <!-- Stylesheets -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet"/>
    <!-- Site Styles - Organized Structure -->
    <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/reading.css' | relative_url }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/theme-light.css' | relative_url }}"/>
    <link rel="stylesheet" href="{{ '/assets/css/theme-dark.css' | relative_url }}"/>

    <!-- Icons -->
    <link rel="shortcut icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}">

    <!-- RSS -->
    {%- feed_meta -%}

    {%- seo -%}
</head>
